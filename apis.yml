apis:
- name: GUARD API
  description: >-
    Real-time consumer credit underwriting / risk-assessment API. Partners POST an underwriting request
    for a credit-card applicant and receive a Guard Score, risk band and credit-limit decision. The call
    is asynchronous: the result is delivered to a partner-registered callback URL once the analysis is
    finished. Authenticated with a 64-character per-partner X-Partner-Auth token and IP allow-listing.
  humanURL: https://developers.altbank.ai/docs/guard
  baseURL: https://guard.altbank.ai
