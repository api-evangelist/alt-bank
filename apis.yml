aid: alt-bank
name: Alt Bank
description: alt.bank (Alt Bank) is a Brazilian fintech providing a fully integrated, turnkey credit-card
  and consumer-credit platform for partners who want to launch prepaid and postpaid cards without becoming
  a financial institution. Its flagship product, GUARD, is a machine-learning underwriting / credit-risk
  engine ("Brazil's most accurate credit model") that returns a Guard Score, risk band and credit-limit
  decision through a real-time partner API. The platform also bundles white-label credit cards (novücard),
  Visa BIN sponsorship, KYC, anti-fraud, dispute management and Pix/boleto payment processing. Partners
  integrate over a documented HTTPS API secured with a per-partner X-Partner-Auth token plus IP allow-listing,
  with a mirrored staging sandbox and asynchronous callback delivery of underwriting results. Backed by
  Anthemis, Union Square Ventures, Repeat Ventures and SquareOne Capital, alt.bank targets financial inclusion
  for underbanked consumers.
